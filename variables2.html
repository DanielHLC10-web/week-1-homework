<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JS variables</h1>
    <p>Variables added up together in JS. Here we learn a different way of adding numbers using JS</p>
    <p id="demo"></p>

    <script>
        var x,y,z ;
         x=5 ;
         y=10;
         z=x+y ;
         document.getElementById("demo").innerHTML="The sum of " + x  +" and " + y + " is " + z ;
    </script>
</body>
</html>
