<body>
    <h1>Divison and Modulus</h1>
    <p id="divison">

    </p>
    <p id="modulus"></p>

    <script>
        var z,y,x,v;
        x=5 ;
        y=11 ;
        z=y/x;
        v=y%x;

        document.getElementById("divison").innerHTML="The divison of "  + y + " and " + x + " = " + z ;
        document.getElementById("modulus").innerHTML="The modulus of " +y + " and " +x + "=" +  v ;


    </script>
